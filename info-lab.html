<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Information Lab</title>
    <!--
      The information lab (docs/brief.md, the carry-over plan: information design).
      A mock of the full game's three layers on a real played game: the map at a
      glance, side panels, the revenue screen. Dev-only: served by `bun run dev`
      at /info-lab.html, never a build input. Data: src/info-lab/snapshot.json
      (scripts/info-snapshot.ts).
    -->
    <!-- The game's tokens first (render.ts reads them); this lab's own below override them. -->
    <link rel="stylesheet" href="/src/game/styles/tokens.css" />
    <style>
      /* Neutral cool greys (the brown paper went: 2026-10-23). */
      :root {
        color-scheme: light;
        --bg: #e9edf1;
        --surface: #ffffff;
        --surface-2: #f3f5f8;
        --ink: #1b2129;
        --ink-2: #4a5563;
        --muted: #7b8694;
        --line: #dde3ea;
        --land: #f4f6f3;
        --water: #b7d4e8;
        --hill: 110 120 110;
        --road: #98a2ad;
        --rail: #3f4852;
        --you: #2a78d6;
        --informal: #e0a400;
        --home: #a3abb5;
        --goods: #8a5a2b;
        --good: #2b8a3e;
        --warn: #c77700;
        --bad: #c92a2a;
        --s1: #2a78d6;
        --s2: #eb6834;
        --s3: #1baf7a;
        --s4: #6250d6;
        --s5: #e34948;
        --load-0: #c3cbd4;
        --load-1: #e8742c; /* busy: orange, never the informal sector's yellow */
        --load-2: #c92a2a;
        --shadow: rgba(20, 30, 45, 0.14);
      }
      @media (prefers-color-scheme: dark) {
        :root:where(:not([data-theme="light"])) {
          color-scheme: dark;
          --bg: #0f1216;
          --surface: #181c22;
          --surface-2: #20252c;
          --ink: #eef1f5;
          --ink-2: #bcc4ce;
          --muted: #87919d;
          --line: #2c323a;
          --land: #1b2026;
          --water: #1f3b54;
          --hill: 170 180 190;
          --road: #5d6670;
          --rail: #b3bcc6;
          --you: #3987e5;
          --informal: #d9a514;
          --home: #6f7882;
          --goods: #c08850;
          --s1: #3987e5;
          --s2: #d95926;
          --s3: #199e70;
          --s4: #9085e9;
          --s5: #e66767;
          --load-0: #444c56;
          --load-1: #e0763a;
          --load-2: #e66767;
          --shadow: rgba(0, 0, 0, 0.5);
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0f1216; --surface: #181c22; --surface-2: #20252c; --ink: #eef1f5; --ink-2: #bcc4ce; --muted: #87919d;
        --line: #2c323a; --land: #1b2026; --water: #1f3b54; --hill: 170 180 190; --road: #5d6670; --rail: #b3bcc6;
        --you: #3987e5; --informal: #d9a514; --home: #6f7882; --goods: #c08850;
        --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #9085e9; --s5: #e66767;
        --load-0: #444c56; --load-1: #e0763a; --load-2: #e66767; --shadow: rgba(0, 0, 0, 0.5);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      .num { font-variant-numeric: tabular-nums; }
      .muted { color: var(--muted); }
      button {
        font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line);
        border-radius: 7px; padding: 4px 10px; cursor: pointer;
      }
      button:hover { border-color: var(--ink-2); }
      button.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }

      /* Layout: strip on top; log on the left, map in the middle, panel on the right. */
      #app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
      #strip {
        display: flex; align-items: stretch; gap: 8px; padding: 10px 14px; background: var(--surface);
        border-bottom: 1px solid var(--line); overflow-x: auto;
      }
      .stat { min-width: 132px; padding: 2px 12px 2px 0; border-right: 1px solid var(--line); }
      .stat:last-of-type { border-right: 0; }
      .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
      .stat .v { font-size: 20px; font-weight: 650; }
      .stat .d { font-size: 11px; }
      .stat svg { display: block; margin-top: 2px; }
      .up { color: var(--good); } .down { color: var(--bad); }
      #strip .spacer { flex: 1; }
      #strip .actions { display: flex; gap: 6px; align-items: center; }

      #main { display: grid; grid-template-columns: 240px 1fr 360px; min-height: 0; }
      #log, #panel { background: var(--surface); overflow-y: auto; min-height: 0; }
      #log { border-right: 1px solid var(--line); padding: 10px 12px; }
      #panel { border-left: 1px solid var(--line); }
      #mapwrap { position: relative; min-height: 0; }
      #map { width: 100%; height: 100%; display: block; cursor: default; }
      #overlays {
        position: absolute; left: 12px; top: 12px; display: flex; gap: 4px; flex-wrap: wrap;
        background: var(--surface); padding: 6px; border-radius: 10px; box-shadow: 0 2px 10px var(--shadow);
      }
      #legend {
        position: absolute; left: 12px; bottom: 12px; background: var(--surface); padding: 8px 10px; border-radius: 10px;
        box-shadow: 0 2px 10px var(--shadow); font-size: 11px; color: var(--ink-2); max-width: 420px;
      }
      #legend .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      #legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; }
      #legend b { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
      #tip {
        position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); padding: 6px 8px;
        border-radius: 6px; font-size: 12px; display: none; z-index: 20; max-width: 280px;
      }

      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
      h2:first-child { margin-top: 0; }
      .event { display: grid; grid-template-columns: 34px 1fr; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
      .event:hover { background: var(--surface-2); }
      .event .day { color: var(--muted); font-variant-numeric: tabular-nums; }
      .event.bad .what { color: var(--bad); }
      .event.good .what { color: var(--good); }
      #logfilter { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
      #logfilter button { padding: 2px 7px; font-size: 11px; }

      /* Side panel: tabs, sortable lists, or one thing's panel. */
      .tabs { display: flex; gap: 4px; padding: 10px 12px 0; }
      .pane { padding: 10px 12px 16px; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th { text-align: right; font-weight: 600; color: var(--muted); padding: 4px 4px; cursor: pointer; white-space: nowrap; border-bottom: 1px solid var(--line); }
      th:first-child, td:first-child { text-align: left; }
      th.sorted { color: var(--ink); }
      td { text-align: right; padding: 5px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
      tr.row { cursor: pointer; }
      tr.row:hover td { background: var(--surface-2); }
      .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
      .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .head .title { font-size: 17px; font-weight: 650; }
      .kicker { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
      .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
      .tile { background: var(--surface-2); border-radius: 9px; padding: 8px 10px; }
      .tile .k { font-size: 11px; color: var(--muted); }
      .tile .v { font-size: 17px; font-weight: 650; }
      .problem {
        margin: 10px 0; padding: 9px 10px; border-radius: 9px; background: color-mix(in srgb, var(--warn) 12%, var(--surface));
        border-left: 3px solid var(--warn); display: flex; gap: 8px; align-items: center; justify-content: space-between;
      }
      .problem.none { background: var(--surface-2); border-left-color: var(--good); }
      .back { margin-bottom: 8px; }
      .bar3 { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--surface); }
      .bar3 i { display: block; height: 100%; }
      .chart { margin: 6px 0 12px; }
      .chart .t { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }

      /* The revenue screen. */
      #revenue {
        position: fixed; inset: 0; background: var(--bg); z-index: 10; display: none; overflow-y: auto; padding: 18px 22px 40px;
      }
      #revenue.open { display: block; }
      #sheet { position: fixed; inset: 0; background: var(--bg); z-index: 11; display: none; overflow-y: auto; padding: 18px 22px 40px; }
      #sheet.open { display: block; }
      #sheet .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
      #sheet .top .title { font-size: 20px; font-weight: 700; }
      #sheet h3 { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 10px 0 4px; }
      #sheet h3 i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
      .icons { display: flex; flex-wrap: wrap; gap: 6px 10px; }
      .icon { width: 140px; }
      .icon canvas { display: block; background: var(--land); border-radius: 8px; }
      .icon .name { font-size: 12px; margin-top: 3px; }
      .icon .note { font-size: 11px; }
      #revenue .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
      #revenue .top .title { font-size: 20px; font-weight: 700; }
      .heroes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
      .hero { background: var(--surface); border-radius: 12px; padding: 12px 14px; }
      .hero .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
      .hero .v { font-size: 26px; font-weight: 700; }
      .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .card { background: var(--surface); border-radius: 12px; padding: 12px 14px; min-width: 0; }
      .card h3 { margin: 0 0 2px; font-size: 14px; }
      .card .sub { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
      .card.wide { grid-column: 1 / -1; }
      .keyrow { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
      .keyrow span { display: inline-flex; align-items: center; gap: 5px; }
      .keyrow i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
      .ranges { display: flex; gap: 4px; }
      @media (max-width: 900px) {
        #main { grid-template-columns: 1fr; grid-template-rows: 50vh auto auto; overflow-y: auto; }
        #log { order: 3; } #panel { order: 2; }
        .heroes, .cards { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="strip"></header>
      <div id="main">
        <aside id="log"></aside>
        <div id="mapwrap">
          <canvas id="map"></canvas>
          <div id="overlays"></div>
          <div id="legend"></div>
        </div>
        <aside id="panel"></aside>
      </div>
    </div>
    <section id="revenue" aria-label="Revenue"></section>
    <section id="sheet" aria-label="Icon sheet"></section>
    <div id="tip"></div>
    <script type="module" src="/src/info-lab/main.ts"></script>
  </body>
</html>
