<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transport Game</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1a1a; overflow: hidden; }
      #scene { position: fixed; inset: 0; display: block; }
      #status {
        position: fixed;
        left: 8px;
        bottom: 8px;
        font: 12px/1.4 monospace;
        color: #ddd;
        background: rgba(0, 0, 0, 0.5);
        padding: 4px 8px;
        border-radius: 4px;
        pointer-events: none;
      }
      #cost-panel {
        position: fixed;
        right: 8px;
        top: 8px;
        font: 12px/1.5 monospace;
        color: #eee;
        background: rgba(0, 0, 0, 0.7);
        padding: 8px 10px;
        border-radius: 4px;
        pointer-events: none;
        display: none;
        min-width: 180px;
      }
      #fleet-hint {
        position: fixed;
        left: 8px;
        bottom: 34px;
        font: 12px/1.4 monospace;
        color: #ffe08a;
        background: rgba(0, 0, 0, 0.5);
        padding: 4px 8px;
        border-radius: 4px;
        pointer-events: none;
      }
      #era-banner {
        position: fixed;
        left: 50%;
        top: 24px;
        transform: translateX(-50%);
        font: bold 16px/1.4 monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.7);
        padding: 8px 16px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      /* Inspector: the one home for per-entity fact and action. Starts
         hidden -- empty when nothing is selected is the correct render,
         not a state to paper over. */
      #inspector {
        position: fixed;
        right: 8px;
        bottom: 8px;
        font: 12px/1.6 monospace;
        color: #eee;
        background: rgba(0, 0, 0, 0.78);
        padding: 8px 10px;
        border-radius: 4px;
        display: none;
        width: 250px;
        max-height: 55vh;
        overflow-y: auto;
      }
      #overlay-picker {
        position: fixed;
        left: 8px;
        bottom: 66px;
        font: 12px/1.5 monospace;
        color: #eee;
        background: rgba(0, 0, 0, 0.65);
        padding: 6px 8px;
        border-radius: 4px;
        min-width: 150px;
      }
      #mode-hint {
        position: fixed;
        left: 50%;
        bottom: 8px;
        transform: translateX(-50%);
        font: 12px/1.4 monospace;
        color: #cfe8ff;
        background: rgba(0, 0, 0, 0.5);
        padding: 4px 8px;
        border-radius: 4px;
        pointer-events: none;
      }
      #pnl-panel {
        position: fixed;
        left: 8px;
        top: 8px;
        font: 12px/1.6 monospace;
        color: #eee;
        background: rgba(0, 0, 0, 0.75);
        padding: 8px 10px;
        border-radius: 4px;
        pointer-events: none;
        display: none;
        min-width: 220px;
        max-height: 60vh;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="status"></div>
    <div id="cost-panel"></div>
    <div id="fleet-hint"></div>
    <div id="pnl-panel"></div>
    <div id="inspector"></div>
    <div id="overlay-picker"></div>
    <div id="mode-hint"></div>
    <div id="era-banner"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
