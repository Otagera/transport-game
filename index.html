<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transport Game</title>
    <style>
      :root {
        --bg: #e9edf1;
        --panel: #ffffff;
        --ink: #1b2129;
        --muted: #7b8694;
        --line: #dde3ea;
        --player: #2f6fdb;
        --danfo: #f2c200;
        --danfo-light: #f8e08a;
        --home: #a3abb5;
        --goods: #8a5a2b;
        --home-text: #6b7581;
        --good: #2b8a3e;
        --bad: #c92a2a;
        /* Neutral cool greys (the information lab, 2026-10-23: the paper brown went);
           otherwise the design lab's step 8 look: blue, mono labels, soft corners. */
        --label-font: ui-monospace, SFMono-Regular, Menlo, monospace;
        --label-tracking: 0.12em;
        --radius: 16px;
        --chip-bg: rgba(255, 255, 255, 0.7);
      }
      #overlays { position: fixed; left: 50%; transform: translateX(-50%); top: 70px; display: flex; gap: 4px; z-index: 4; background: var(--panel); padding: 5px; border-radius: 10px; box-shadow: 0 2px 10px rgba(20, 30, 45, 0.14); }
      #overlays button { font: 600 12px system-ui, sans-serif; padding: 4px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
      #overlays button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
      #zoom-control { position: fixed; right: 80px; top: 76px; display: flex; gap: 4px; z-index: 4; }
      #zoom-control button { font: 600 13px system-ui, sans-serif; min-width: 30px; padding: 4px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
      #zoom-control button:hover { border-color: var(--muted); }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; font: 14px/1.4 system-ui, sans-serif; }
      #map { position: fixed; inset: 0; display: block; }
      #strip {
        position: fixed; left: 0; right: 0; top: 0; height: 56px;
        display: flex; align-items: center; gap: 28px; padding: 0 20px;
        background: var(--panel); border-bottom: 1px solid var(--line);
      }
      .stat { display: flex; flex-direction: column; }
      .k { font-family: var(--label-font); font-size: 10px; text-transform: uppercase; letter-spacing: var(--label-tracking); color: var(--muted); }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; background: var(--chip-bg); border: 1px solid var(--line); font-size: 12px; white-space: nowrap; }
      .chip b { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
      .chip .num { font-weight: 650; font-variant-numeric: tabular-nums; }
      .chip.hatch b { background: repeating-linear-gradient(45deg, var(--home) 0 2px, transparent 2px 4px); border: 1px solid var(--home); box-sizing: border-box; }
      .stat .v { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; white-space: nowrap; }
      .stat .v .trend { font-size: 12px; margin-left: 6px; }
      .stat .v .spark { margin-left: 8px; }
      .spark polyline { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; opacity: 0.55; }
      .good { color: var(--good); }
      .bad { color: var(--bad); }
      .share { flex: 1; max-width: 460px; }
      /* A site's production (production.ts): one gauge a line, the binding one marked. */
      .production { margin: 6px 0 10px; display: grid; gap: 6px; }
      .production .prow { display: grid; grid-template-columns: 1fr auto; font-size: 12px; gap: 0 8px; }
      .production .prow.main { font-weight: 600; font-size: 13px; }
      .production .prow .bar { grid-column: 1 / -1; height: 6px; margin: 2px 0 0; }
      .production .num { font-variant-numeric: tabular-nums; color: var(--muted); }
      .production .held { color: var(--bad); font-weight: 600; }
      .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); margin: 3px 0 2px; }
      .bar i { display: block; height: 100%; transition: width 0.3s; }
      .legend { font-size: 12px; }
      .danfo-text { color: #9a7a00; }
      /* Two wings (the design lab's pick, 2026-10-20: glass, leaning 7° at rest and flat when
         used, tucked at the edge and out on hover, town left and routes right): a spine shows
         at rest; hovering it, focusing it, a town hovered or selected on the map, or a click on
         the spine (pinned) brings a wing out and flat. */
      .wing {
        --side: 1; --dock-now: 1; --tilt-now: 1;
        position: fixed; top: 72px; bottom: 132px; width: 300px; box-sizing: border-box; overflow: hidden; z-index: 6;
        background: rgb(255 255 255 / 0.68); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
        border: 1px solid var(--line); border-radius: var(--radius);
        box-shadow: 0 0 0 1px rgb(120 180 255 / 0.25), 0 16px 48px rgb(40 110 220 / 0.18);
        transform: perspective(1400px) translateX(calc(var(--side) * var(--dock-now) * (100% - 44px))) rotateY(calc(var(--side) * var(--tilt-now) * -7deg));
        transition: transform 0.34s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s;
      }
      .wing:hover, .wing:focus-within, .wing.out, .wing.pinned { --dock-now: 0; --tilt-now: 0; transition-delay: 0s; }
      #wing-routes { right: 16px; transform-origin: right center; }
      #wing-town { left: 16px; --side: -1; transform-origin: left center; }
      /* A town under the left wing's space: its card opens from the right, over your routes,
         so it never covers the town you're pointing at (playtest, map 2418). */
      #wing-town.flip { left: auto; right: 16px; --side: 1; transform-origin: right center; z-index: 8; }
      #wing-town.flip .spine { display: none; }
      .wing-body { position: absolute; inset: 0; overflow-y: auto; padding: 12px 14px 12px 14px; transition: opacity 0.2s 0.15s; }
      .wing:not(:hover):not(:focus-within):not(.out):not(.pinned) .wing-body { opacity: 0; }
      .spine {
        position: absolute; top: 0; bottom: 0; width: 44px; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 10px;
        writing-mode: vertical-rl; cursor: pointer; background: rgb(255 255 255 / 0.96); transition: opacity 0.2s; font-size: 12px; white-space: nowrap;
      }
      .spine .k { font-size: 10px; }
      .spine .num { font-weight: 650; }
      #wing-routes .spine { left: 0; border-right: 1px solid var(--line); }
      #wing-town .spine { right: 0; border-left: 1px solid var(--line); transform: rotate(180deg); }
      .wing:hover .spine, .wing:focus-within .spine, .wing.out .spine, .wing.pinned .spine { opacity: 0; pointer-events: none; }
      .wing.pinned { box-shadow: 0 0 0 2px var(--player), 0 16px 48px rgb(40 110 220 / 0.18); }
      .panel-body h2 { margin: 0; font-size: 14px; }
      .panel-body h2.section { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
      .panel-body .hint, .panel-body .empty { margin: 2px 0 8px; color: var(--muted); font-size: 12px; }
      .panel-body .muted { color: var(--muted); font-weight: 400; }
      .panel-body .results { list-style: none; margin: 0 0 12px; padding: 0; font-size: 12px; line-height: 1.4; }
      .panel-body .results li { padding: 6px 8px; margin-bottom: 4px; border-radius: 6px; background: #f3f5f8; }
      .panel-body .results li.good { border-left: 3px solid var(--good); }
      .panel-body .results li.bad { border-left: 3px solid var(--bad); }
      .panel-body .results li.pending { color: var(--muted); font-style: italic; }
      .panel-body .moves { list-style: none; margin: 0 0 12px; padding: 0; font-size: 12px; line-height: 1.35; }
      .panel-body .moves li { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; margin-bottom: 4px; border-radius: 6px; background: #f3f5f8; }
      .panel-body .moves li.good { border-left: 3px solid var(--good); }
      .panel-body .moves li.bad { border-left: 3px solid var(--bad); }
      .panel-body .moves li span { font-weight: 600; }
      .panel-body .moves small { display: block; font-weight: 400; color: var(--muted); }
      .panel-body .moves button { border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 4px 10px; cursor: pointer; font: inherit; }
      .panel-body .moves button:hover:not([disabled]) { border-color: var(--ink); }
      .panel-body .moves button[disabled] { opacity: 0.45; cursor: default; }
      .panel-body .results small { color: var(--muted); margin-right: 4px; }
      .panel-body .callout { margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: #fff0f0; color: var(--bad); font-size: 12px; line-height: 1.4; }
      .panel-body .callout .k { display: block; color: inherit; margin-bottom: 2px; }
      .panel-body .callout.hook { background: color-mix(in srgb, var(--danfo) 14%, transparent); color: var(--ink); border-left: 3px solid var(--danfo); }
      /* Town card */
      .town-card .title { font-weight: 650; font-size: 22px; margin: 2px 0 6px; }
      .town-card ul { margin: 0 0 8px; padding-left: 16px; font-size: 12px; }
      .town-card li { margin: 0 0 3px; }
      .trip.cut .bar { background: repeating-linear-gradient(90deg, var(--home) 0 4px, transparent 4px 7px); }
      .pager { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 11px; color: var(--muted); }
      .pager button { font: inherit; border: 1px solid var(--line); background: none; color: var(--ink); border-radius: 999px; padding: 2px 8px; cursor: pointer; }
      .dots { display: flex; gap: 3px; }
      .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
      .dots i.on { background: var(--player); }
      /* Route cards */
      .route-card { margin: 0 0 8px; padding: 9px 11px; border: 1px solid var(--line); border-radius: calc(var(--radius) * 0.8); background: #f6f8fa; }
      .route-card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
      .route-card .net { font-weight: 650; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .route-card .name { display: flex; align-items: center; gap: 6px; font-weight: 650; font-size: 14px; margin: 2px 0; }
      .route-card .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
      .route-card .buttons { margin-left: auto; display: flex; gap: 4px; }
      .route-card button { width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; font-size: 15px; line-height: 1; color: var(--ink); }
      .route-card button:hover { border-color: var(--ink); }
      .route-card .verdict { font-size: 12px; }
      .route-card .verdict.why-healthy { color: var(--good); }
      .route-card .bar { height: 6px; margin: 5px 0 0; }
      .route-card small { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
      /* A strike, on the cards that touch its corridor */
      .strike-badge { margin: 4px 0; padding: 3px 8px; border-radius: 6px; font: 600 11px var(--label-font); letter-spacing: 0.04em; }
      .strike-badge.on { background: var(--bad); color: #fff; }
      .strike-badge.called { background: color-mix(in srgb, #f08c00 18%, transparent); color: #9a4f00; border: 1px solid #f08c00; }
      .panel-body .callout .actions { display: flex; gap: 6px; margin-top: 6px; }
      .panel-body .callout .project-bar { height: 6px; margin: 6px 0 0; }
      .panel-body .callout button { font: 600 11px var(--label-font); border: 1px solid var(--player); background: #fff; color: var(--player); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
      .panel-body .callout button:hover { background: var(--player); color: #fff; }
      .panel-body .production button { font: 600 11px var(--label-font); border: 1px solid var(--player); background: #fff; color: var(--player); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
      .panel-body .production button:hover:not([disabled]) { background: var(--player); color: #fff; }
      .panel-body .production button[disabled] { opacity: 0.5; cursor: default; }
      .strike-badge .actions { display: flex; gap: 6px; margin-top: 4px; }
      .strike-badge button { font: 600 11px var(--label-font); border: 1px solid #f08c00; background: #fff; color: #9a4f00; border-radius: 6px; padding: 2px 8px; cursor: pointer; }
      .strike-badge button:hover { background: #f08c00; color: #fff; }
      .strike-badge.past { background: color-mix(in srgb, var(--bad) 8%, transparent); color: var(--bad); }
      /* Budget */
      .corridor { margin: 0 0 8px; font-size: 12px; }
      .corridor .top { display: flex; justify-content: space-between; gap: 8px; }
      .corridor .name { font-weight: 650; }
      .corridor .taken { font: 600 11px var(--label-font); color: #fff; background: var(--player); border-radius: 999px; padding: 0 7px; }
      .corridor .bar { height: 6px; margin: 4px 0 2px; }
      .panel-body .corridor .hint { margin: 0; }
      .corridor .noseat { margin-top: 2px; color: var(--ink); }
      .corridor .wear { margin-top: 2px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
      .corridor .wear .actions { display: inline-flex; gap: 6px; }
      .corridor button { font: 600 11px var(--label-font); border: 1px solid var(--player); background: #fff; color: var(--player); border-radius: 6px; padding: 1px 7px; cursor: pointer; }
      .corridor button:hover { background: var(--player); color: #fff; }
      .budget { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 12px; }
      .budget .num { font-variant-numeric: tabular-nums; text-align: right; }
      .budget .total { border-top: 1px solid var(--line); padding-top: 3px; font-weight: 650; }
      .panel-body .budget + .hint, .panel-body .budget + .callout { margin-top: 8px; }
      .panel-body .budget + .callout + .hint { margin-top: 0; }
      .share-bar { height: 8px; margin: 2px 0 4px; }
      .panel-body .callout kbd { font: 11px ui-monospace, monospace; }
      .panel-body .townshare { margin: 0 0 6px; font-size: 12px; }
      .panel-body .inside { margin: 8px 0 10px; padding: 8px 10px; border-radius: 8px; border: 1px dashed var(--line); color: var(--muted); font-size: 12px; line-height: 1.4; }
      .panel-body .inside b { color: var(--ink); }
      .trip { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px; }
      .trip .name { font-weight: 600; }
      .trip .num { font-variant-numeric: tabular-nums; color: var(--muted); }
      .trip .bar { grid-column: 1 / -1; height: 6px; margin: 0; }
      .route { display: grid; grid-template-columns: 10px 1fr auto auto auto; align-items: center; gap: 6px; padding: 6px 0; border-top: 1px solid var(--line); }
      .route .detail { grid-column: 2 / -1; }
      .route .detail .bar { height: 6px; margin: 4px 0; }
      .route .why { font-size: 12px; line-height: 1.35; }
      .route .why-healthy { color: var(--good); }
      .route .why-thin, .route .why-overcapacity, .route .why-long { color: var(--bad); }
      .route .swatch { width: 10px; height: 10px; border-radius: 3px; }
      .route .name { font-weight: 600; font-size: 13px; }
      .route small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
      .route .net { font-weight: 650; font-variant-numeric: tabular-nums; font-size: 13px; }
      .route button { width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; font-size: 15px; line-height: 1; color: var(--ink); }
      .route button:hover { border-color: var(--ink); }
      #toolbar {
        /* Right of the key, left of the side panel: nine tools don't fit centred over a wide key. */
        position: fixed; right: 316px; bottom: 16px;
        display: flex; gap: 4px; align-items: flex-end; padding: 4px; background: rgb(255 255 255 / 0.78); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: var(--radius);
      }
      #toolbar button { border: 1px solid transparent; background: none; border-radius: 7px; padding: 6px 8px; font: inherit; cursor: pointer; color: var(--ink); white-space: nowrap; }
      #toolbar button.active { background: var(--ink); color: var(--panel); }
      #toolbar kbd { font: 11px ui-monospace, monospace; opacity: 0.6; margin-left: 4px; }
      #toolbar .group { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 3px 4px 4px; border-radius: 8px; }
      #toolbar .cap { font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
      #toolbar .row { display: flex; gap: 2px; align-items: center; }
      #toolbar .group.road { background: rgba(150, 160, 175, 0.22); }
      #toolbar .group.rail { background: rgba(30, 40, 55, 0.1); }
      #toolbar .group.build { border: 1px dashed var(--line); }
      #toolbar .group.time { margin-left: 4px; }
      #toolbar .switch { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 7px; padding: 1px; }
      #toolbar .switch button { padding: 4px 8px; border-radius: 6px; }
      #toolbar .switch button.on { background: var(--ink); color: var(--panel); }
      #toolbar .switch kbd { margin: 0 4px; }
      /* Control hint line, over the toolbar (lab: "One line above the toolbar"). */
      #controls a { color: inherit; }
      #controls { position: fixed; right: 20px; top: 9px; max-width: 230px; text-align: right; font-size: 11px; line-height: 1.45; color: var(--muted); z-index: 3; }
      body:not([data-dev="true"]) #toolbar { right: auto; left: 50%; transform: translateX(-50%); }
      body:not([data-dev="true"]) #key { display: none; }
      /* A hint: beside the town it's about, else over the control line. */
      #hint { position: fixed; left: 50%; bottom: 160px; transform: translateX(-50%); max-width: 320px; display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px 8px 12px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--player); border-radius: var(--radius); box-shadow: 0 6px 20px rgba(20, 30, 45, 0.18); font-size: 13px; line-height: 1.35; }
      #hint.anchored { bottom: auto; transform: none; }
      #hint[hidden] { display: none; }
      #hint button { flex: none; border: 1px solid var(--line); background: none; border-radius: 6px; padding: 1px 6px; cursor: pointer; font: 11px var(--label-font); color: var(--muted); }
      #hint button:hover { color: var(--ink); border-color: var(--ink); }
      /* The Treasury drawer (brief, Revision 3, Money, 5; the design lab's pick): a tab over the
         control line, out on hover or focus into four columns; a click pins it open. */
      #treasury {
        position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
        width: min(1100px, calc(100% - 140px)); box-sizing: border-box; z-index: 5; overflow: hidden;
        max-height: 34px; background: rgb(255 255 255 / 0.82); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: var(--radius);
        box-shadow: 0 6px 20px rgba(20, 30, 45, 0.12); transition: max-height 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s;
      }
      #treasury:hover, #treasury:focus-within, #treasury.pinned { max-height: min(460px, calc(100vh - 220px)); overflow-y: auto; transition-delay: 0s; }
      #treasury .tab { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 14px; font-size: 12px; white-space: nowrap; cursor: pointer; }
      #treasury .tab .k { font: 600 10px var(--label-font); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
      #treasury .tab .more { margin-left: auto; color: var(--muted); }
      #treasury .drawer-body { padding: 2px 16px 14px; border-top: 1px solid var(--line); }
      #treasury .tgrid { display: grid; grid-template-columns: 1.15fr 1fr 1.15fr 1.25fr; gap: 10px 18px; }
      #treasury .tcol h3 { margin: 6px 0 4px; font: 600 10px var(--label-font); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
      #treasury .budget { font-size: 12px; }
      #treasury .callout, #treasury .hint { font-size: 12px; margin: 4px 0; color: var(--muted); }
      #treasury .callout { color: inherit; }
      .chain { margin: 0 0 6px; font-size: 12px; padding-left: 8px; border-left: 3px solid var(--line); }
      .chain.bad { border-color: var(--bad); }
      .chain.warn { border-color: var(--danfo); }
      .chain.good { border-color: var(--good); }
      #treasury .tab .chain { margin: 0; }
      @media (max-width: 900px) { #treasury { left: 50%; width: calc(100% - 32px); } #treasury .tgrid { grid-template-columns: 1fr 1fr; } }
      #toast {
        position: fixed; left: 50%; bottom: 128px; transform: translateX(-50%); z-index: 7;
        background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-size: 13px;
        opacity: 0; transition: opacity 0.4s; pointer-events: none; max-width: calc(100% - 32px);
      }
      #toast[data-bad="true"] { background: var(--bad); }
      #key { position: fixed; left: 16px; bottom: 16px; max-width: 470px; box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 11px; color: var(--muted); }
      #key b { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }
      #key summary { cursor: pointer; color: var(--ink); font-weight: 600; margin-bottom: 2px; }
      #key:not([open]) { padding: 6px 12px; }
      @media (max-width: 1100px) { #key { display: none; } }
      @media (max-width: 900px) { #toolbar { right: 16px; } body:not([data-dev="true"]) #toolbar, #hint:not(.anchored) { left: 50%; } }
      @media (max-width: 900px) { .wing { display: none; } .stat:last-child { display: none; } }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="strip"></div>
    <section class="wing" id="wing-town" tabindex="0" aria-label="Town">
      <div class="spine" data-spine="town"></div>
      <div class="wing-body panel-body" id="town"></div>
    </section>
    <section class="wing" id="wing-routes" tabindex="0" aria-label="Your routes">
      <div class="spine" data-spine="routes"></div>
      <div class="wing-body panel-body" id="routes"></div>
    </section>
    <details id="key" open><summary>Key</summary>
      Road: width = traffic · <b style="background:#c3cbd4"></b>free <b style="background:#e8742c"></b>busy <b style="background:#c92a2a"></b>jammed · <b style="background:var(--player)"></b>your riders<br />
      Beside it: <b style="background:var(--danfo)"></b>danfos, kekes, okadas <b style="background:var(--goods)"></b>trucks (wider, more)<br />
      Your vehicles fill as full as their route runs · ring: <b style="background:var(--player)"></b>you <b style="background:var(--danfo)"></b>informal <b style="background:var(--home)"></b>stayed home<br />
      ! a problem (its card says the move) · ▲▼ growing · wheel to zoom, drag to pan, 0 to fit
    </details>
    <div id="overlays"></div>
    <div id="controls"><span id="map-seed"></span></div>
    <div id="hint" hidden></div>
    <section id="treasury" tabindex="0" aria-label="Treasury"></section>
    <div id="toolbar"></div>
    <div id="toast"></div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
