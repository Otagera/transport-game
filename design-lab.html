<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design Lab</title>
    <!-- Only the "Display + mono" type option uses these; every option falls back to system fonts offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Michroma&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /*
       * Design lab (docs/brief.md, Information design; build step 8). Every look
       * on the stage is a token: a CSS custom property set by src/design-lab/main.ts
       * from the option you pick, or a data- attribute on #stage for the ones that
       * change structure. Dev-only: served by `bun run dev` at /design-lab.html,
       * not a build input (vite.config.ts), so it never ships.
       */
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        display: grid; grid-template-columns: 320px 1fr;
        font: 13px/1.4 system-ui, sans-serif; color: #24221f; background: #f4f1ea;
      }

      /* ---- The lab's own controls: plain, so they never compete with the stage. ---- */
      #lab { overflow-y: auto; border-right: 1px solid #ddd5c4; background: #fbf9f4; padding: 14px 14px 40px; }
      #lab h1 { margin: 0; font-size: 16px; }
      #lab .lede { margin: 2px 0 10px; color: #7a7368; font-size: 12px; }
      #lab .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
      #lab button { font: inherit; font-size: 12px; border: 1px solid #d9ccae; background: #fff; border-radius: 6px; padding: 4px 8px; cursor: pointer; color: inherit; }
      #lab button:hover { border-color: #24221f; }
      #lab .group { border-top: 1px solid #e6dfcf; padding: 10px 0 6px; }
      #lab .group h2 { margin: 0; font-size: 13px; }
      #lab .group .why { margin: 1px 0 6px; color: #8a8276; font-size: 11px; }
      #lab .opt { display: grid; grid-template-columns: 1fr auto auto; gap: 4px; align-items: center; margin: 2px 0; }
      #lab .opt .pick { text-align: left; border-color: transparent; background: none; padding: 4px 6px; }
      #lab .opt .pick::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 7px; border-radius: 50%; border: 1.5px solid #9b917f; vertical-align: -1px; }
      #lab .opt.on .pick { background: #efe8d8; font-weight: 600; }
      #lab .opt.on .pick::before { background: #24221f; border-color: #24221f; }
      #lab .opt .note { display: block; font-weight: 400; color: #8a8276; font-size: 11px; margin-left: 18px; }
      #lab .verdict { font-size: 11px; padding: 2px 6px; color: #8a8276; }
      #lab .verdict.keep.set { background: #2b8a3e; border-color: #2b8a3e; color: #fff; }
      #lab .verdict.drop.set { background: #c92a2a; border-color: #c92a2a; color: #fff; }
      #lab .slider { display: flex; align-items: center; gap: 8px; margin: 4px 0 2px 24px; font-size: 12px; color: #6d665b; }
      #lab .slider input { flex: 1; }
      #lab textarea { width: 100%; box-sizing: border-box; min-height: 40px; font: inherit; font-size: 12px; border: 1px solid #e0d7c4; border-radius: 6px; padding: 5px 7px; resize: vertical; background: #fff; }
      #lab details summary { cursor: pointer; color: #8a8276; font-size: 11px; margin: 2px 0; }
      #export { width: min(760px, 90vw); border: 1px solid #d9ccae; border-radius: 10px; padding: 14px; }
      #export textarea { width: 100%; height: 60vh; box-sizing: border-box; font: 12px/1.45 ui-monospace, monospace; }
      #export .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

      /* ---- The stage: a mock of the slice's screen, styled only by tokens. ---- */
      #stage {
        --wing-w: 300px;
        --strip-h: 60px;
        --map-left: 24px;
        --map-right: calc(var(--wing-w) + 32px);
        position: relative; overflow: hidden;
        font-family: var(--font-sans); color: var(--ink);
        background-color: var(--bg);
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 28px 28px;
      }
      #stage[data-layout="wings"] { --map-left: calc(var(--wing-w) + 32px); }
      #stage[data-dock="tucked"] { --map-right: 64px; }
      #stage[data-dock="tucked"][data-layout="wings"] { --map-left: 64px; }

      .label {
        font-family: var(--label-font); font-size: 10px; letter-spacing: var(--label-tracking);
        text-transform: uppercase; color: var(--muted);
      }
      .num { font-variant-numeric: tabular-nums; }
      .panel {
        background: rgb(var(--panel-rgb) / var(--panel-opacity));
        backdrop-filter: blur(var(--panel-blur)); -webkit-backdrop-filter: blur(var(--panel-blur));
        border: 1px solid var(--line); border-radius: var(--radius);
        box-shadow: var(--panel-glow);
      }
      /* Corner marks: four short brackets drawn as gradients, so any card can wear them. */
      #stage[data-shape="marks"] .marked {
        --m: linear-gradient(var(--you), var(--you));
        background-image: var(--m), var(--m), var(--m), var(--m), var(--m), var(--m), var(--m), var(--m);
        background-repeat: no-repeat;
        background-size: 10px 1.5px, 1.5px 10px, 10px 1.5px, 1.5px 10px, 10px 1.5px, 1.5px 10px, 10px 1.5px, 1.5px 10px;
        background-position: left top, left top, right top, right top, left bottom, left bottom, right bottom, right bottom;
      }

      /* Map */
      #lab-map {
        position: absolute; top: calc(var(--strip-h) + 14px); bottom: 92px;
        left: var(--map-left); right: var(--map-right);
        width: calc(100% - var(--map-left) - var(--map-right)); height: calc(100% - var(--strip-h) - 106px);
        transition: left 0.3s, right 0.3s, width 0.3s;
      }
      #lab-map .land { fill: var(--land); stroke: var(--land-edge); stroke-width: 1px; vector-effect: non-scaling-stroke; }
      #lab-map .slab { display: none; fill: var(--land-edge); }
      #stage[data-plate="diorama"] #lab-map .slab { display: inline; }
      #stage[data-plate="diorama"] #lab-map { filter: drop-shadow(0 18px 22px var(--shadow)); }
      #lab-map .river { fill: none; stroke: var(--water); stroke-linecap: round; stroke-linejoin: round; }
      #lab-map .blobs { display: none; }
      #lab-map .blobs rect { fill: rgb(var(--hill-rgb)); }
      #lab-map .contours { display: none; }
      #stage[data-terrain="blobs"] #lab-map .blobs { display: inline; }
      #stage[data-terrain^="contours"] #lab-map .contours { display: inline; }
      #lab-map .contours path { fill: none; stroke: var(--contour); stroke-width: 1px; vector-effect: non-scaling-stroke; }
      #lab-map .contours path.major { stroke-width: 1.6px; }
      #lab-map .ground { display: none; font-family: var(--label-font); fill: var(--muted); font-size: 1.5px; letter-spacing: 0.5px; text-transform: uppercase; }
      #stage[data-terrain="contours-labels"] #lab-map .ground { display: inline; }
      #lab-map .road { fill: none; stroke-width: 0.55; stroke-linecap: round; }
      #lab-map .road.dirt { stroke: var(--road-dirt); stroke-dasharray: 1.2 0.8; }
      #lab-map .road.paved { stroke: var(--road-paved); stroke-width: 0.7; }
      #lab-map .route { fill: none; stroke: var(--you); stroke-width: 0.45; stroke-linecap: round; opacity: 0.9; }
      #lab-map .desire { stroke: var(--muted); stroke-linecap: round; opacity: 0.55; }
      #lab-map .desire.cut { stroke-dasharray: 0.8 0.8; stroke: var(--bad); opacity: 0.6; }
      #lab-map .town-core { fill: rgb(var(--panel-rgb)); stroke: var(--ink); stroke-width: 0.25; cursor: pointer; }
      #lab-map .ring { fill: none; stroke-width: 0.7; }
      #lab-map .ring.you { stroke: var(--you); }
      #lab-map .ring.informal { stroke: var(--informal); }
      #lab-map .ring.home { stroke: var(--home); }
      #lab-map .town-name { font-family: var(--font-sans); font-weight: 600; font-size: 1.7px; fill: var(--ink); text-anchor: middle; pointer-events: none; }
      #lab-map .town-pop { font-family: var(--label-font); font-size: 1.25px; fill: var(--muted); text-anchor: middle; pointer-events: none; }
      #lab-map .noroad { font-family: var(--label-font); font-size: 1.25px; fill: var(--bad); text-anchor: middle; pointer-events: none; }
      #lab-map .bus { fill: var(--you); }
      #lab-map .danfo { fill: var(--informal); stroke: #222; stroke-width: 0.12; }

      /* Strip: the headline */
      #lab-strip {
        position: absolute; left: 0; right: 0; top: 0; height: var(--strip-h); box-sizing: border-box;
        display: flex; align-items: center; gap: 26px; padding: 0 20px;
        border-width: 0 0 1px; border-radius: 0;
      }
      #lab-strip .stat { display: flex; flex-direction: column; }
      #lab-strip .stat .v { font-size: 18px; font-weight: 650; font-family: var(--font-display); }
      #lab-strip .good { color: var(--good); }
      #lab-strip .share { flex: 1; max-width: 420px; }
      #lab-strip .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); margin: 3px 0 2px; }
      #lab-strip .bar i { display: block; height: 100%; }
      #lab-strip .chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip {
        display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px;
        background: var(--chip-bg); border: 1px solid var(--line); font-size: 12px; white-space: nowrap;
      }
      .chip b { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
      .chip .num { font-weight: 650; }
      .chip.hatch b { background: repeating-linear-gradient(45deg, var(--home) 0 2px, transparent 2px 4px) !important; border: 1px solid var(--home); box-sizing: border-box; }
      #stage[data-headline="bar"] .h-chips { display: none; }
      #stage[data-headline="chips"] .h-bar { display: none; }

      /* Wings: side panels. Tilt and docking are both tokens; hovering, focusing, or a town
         hovered on the map brings a wing out and (pose permitting) flat to face you. */
      .wing {
        --side: 1;
        --dock-now: var(--dock-hide);
        --tilt-now: var(--tilt-rest);
        position: absolute; top: calc(var(--strip-h) + 14px); bottom: 92px; width: var(--wing-w);
        box-sizing: border-box; overflow: hidden;
        transform: perspective(1400px)
          translateX(calc(var(--side) * var(--dock-now) * (100% - var(--dock-keep))))
          rotateY(calc(var(--side) * var(--tilt-now) * var(--tilt-angle) * -1));
        transition: transform 0.34s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s;
      }
      .wing:hover, .wing:focus-within, .wing.out, .wing.pinned { --dock-now: 0; --tilt-now: var(--tilt-hover); transition-delay: 0s; }
      #wing-right { right: 16px; transform-origin: right center; }
      #wing-left { left: 16px; --side: -1; transform-origin: left center; }
      #stage[data-layout="one"] #wing-left { display: none; }
      .wing-body { position: absolute; inset: 0; overflow-y: auto; padding: 14px 16px; transition: opacity 0.2s 0.15s; }
      /* Tucked, a wing shows only its spine: tilted, the rest of it would peek past the edge. */
      #stage[data-dock="tucked"] .wing:not(:hover):not(:focus-within):not(.out):not(.pinned) .wing-body { opacity: 0; }
      .spine {
        position: absolute; top: 0; bottom: 0; width: var(--dock-keep); z-index: 2;
        display: none; align-items: center; justify-content: center; gap: 10px;
        writing-mode: vertical-rl; cursor: pointer;
        background: rgb(var(--panel-rgb) / 0.96); transition: opacity 0.2s;
      }
      #wing-right .spine { left: 0; border-right: 1px solid var(--line); }
      #wing-left .spine { right: 0; border-left: 1px solid var(--line); transform: rotate(180deg); }
      #stage[data-dock="tucked"] .spine { display: flex; }
      .wing:hover .spine, .wing:focus-within .spine, .wing.out .spine, .wing.pinned .spine { opacity: 0; pointer-events: none; }
      .spine .label { font-size: 10px; }
      .spine .num { font-size: 12px; font-weight: 650; color: var(--ink); }

      .wing h2 { margin: 0 0 2px; font-size: 14px; font-family: var(--font-display); font-weight: var(--title-weight); }
      .wing h2.section { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
      .wing .hint { margin: 2px 0 8px; color: var(--muted); font-size: 12px; }
      .wing p { margin: 0 0 8px; font-size: 12px; }
      .callout { margin: 8px 0; padding: 8px 10px; border-radius: calc(var(--radius) * 0.8); font-size: 12px; }
      .callout.bad { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }
      .callout.hook { border-left: 3px solid var(--informal); background: color-mix(in srgb, var(--informal) 14%, transparent); }
      .inside { margin: 8px 0; padding: 8px 10px; border-radius: calc(var(--radius) * 0.8); border: 1px dashed var(--line); color: var(--muted); font-size: 12px; }
      .tripbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line); margin: 3px 0 0; }
      .tripbar i { display: block; height: 100%; }
      .trip { display: grid; grid-template-columns: 1fr auto; padding: 5px 0; border-top: 1px solid var(--line); font-size: 12px; }
      .trip .tripbar { grid-column: 1 / -1; }

      /* Town panel: two content variants */
      #stage[data-town="text"] .town-card { display: none; }
      #stage[data-town="card"] .town-text { display: none; }
      .town-card .title { font-family: var(--font-display); font-weight: var(--title-weight); font-size: 22px; margin: 2px 0 6px; }
      .town-card ul { margin: 0 0 6px; padding-left: 16px; font-size: 12px; }
      .town-card li { margin: 0 0 3px; }
      .pager { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 11px; color: var(--muted); }
      .pager button { font: inherit; border: 1px solid var(--line); background: none; color: var(--ink); border-radius: 999px; padding: 2px 8px; cursor: pointer; }
      .dots { display: flex; gap: 3px; }
      .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
      .dots i.on { background: var(--you); }

      /* Routes panel: two content variants */
      #stage[data-routes="rows"] .route-card { display: none; }
      #stage[data-routes="cards"] .route-row { display: none; }
      .route-row { display: grid; grid-template-columns: 10px 1fr auto; gap: 6px; padding: 6px 0; border-top: 1px solid var(--line); }
      .route-row .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--you); margin-top: 4px; }
      .route-row .name { font-weight: 600; font-size: 13px; }
      .route-row small { display: block; color: var(--muted); font-size: 11px; }
      .route-row .net { font-weight: 650; font-size: 13px; }
      .route-row .detail { grid-column: 2 / -1; font-size: 12px; }
      .route-card { margin: 0 0 8px; padding: 9px 11px; border: 1px solid var(--line); border-radius: calc(var(--radius) * 0.8); background: rgb(var(--panel-rgb) / 0.6); }
      .route-card .top { display: flex; justify-content: space-between; align-items: baseline; }
      .route-card .name { font-family: var(--font-display); font-weight: var(--title-weight); font-size: 14px; margin: 1px 0 2px; }
      .route-card .verdict { font-size: 12px; }
      .pos { color: var(--good); }
      .neg { color: var(--bad); }
      .budget { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 12px; }
      .budget .total { border-top: 1px solid var(--line); padding-top: 3px; font-weight: 650; }

      /* Key box (only with the share-bar headline: chips are their own key) */
      #lab-key { position: absolute; left: 16px; bottom: 16px; max-width: 360px; padding: 8px 12px; font-size: 11px; color: var(--muted); }
      #lab-key b { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: -1px; margin: 0 4px 0 6px; }
      #stage[data-headline="chips"] #lab-key { display: none; }

      /* Toolbar: slice zero's tools only */
      #lab-toolbar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; }
      #lab-toolbar .group { display: flex; flex-direction: column; align-items: center; padding: 3px 5px 4px; }
      #lab-toolbar .cap { font-size: 9px; }
      #lab-toolbar .btns { display: flex; gap: 2px; }
      #lab-toolbar button { font: inherit; font-size: 12px; border: 0; background: none; color: var(--ink); padding: 6px 9px; border-radius: calc(var(--radius) * 0.7); cursor: pointer; }
      #lab-toolbar button.active { background: var(--toolbar-active-bg); color: var(--toolbar-active-ink); }
      #lab-toolbar kbd { font: 10px var(--font-mono); opacity: 0.6; margin-left: 4px; }
      #stage[data-headline="bar"] #lab-toolbar { left: auto; right: calc(var(--map-right) + 8px); transform: none; }

      #lab-hint { position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%); padding: 3px 10px; border-radius: 999px; font-size: 11px; color: var(--muted); white-space: nowrap; }
      #stage[data-hint="off"] #lab-hint { display: none; }
    </style>
  </head>
  <body>
    <aside id="lab" aria-label="Design lab controls"></aside>
    <main id="stage">
      <svg id="lab-map" viewBox="-2 -2 104 70" preserveAspectRatio="xMidYMid meet" aria-label="Slice map mock"></svg>
      <header id="lab-strip" class="panel"></header>
      <section class="wing panel" id="wing-left" tabindex="0" aria-label="Town panel">
        <div class="spine"></div>
        <div class="wing-body"></div>
      </section>
      <section class="wing panel" id="wing-right" tabindex="0" aria-label="Routes panel">
        <div class="spine"></div>
        <div class="wing-body"></div>
      </section>
      <div id="lab-key" class="panel">
        <b style="background: var(--you)"></b>you <b style="background: var(--informal)"></b>informal <b style="background: var(--home)"></b>stayed home<br />
        Town: ring = where people went · Road: dashed = dirt, solid = paved
      </div>
      <div id="lab-hint" class="panel">Hover a town: where its people want to go · B bus · M minibus · R road · Space pause</div>
      <nav id="lab-toolbar" class="panel"></nav>
    </main>
    <dialog id="export">
      <div class="label" style="margin-bottom: 6px">Your picks, as markdown: paste into the brief or the other session</div>
      <textarea readonly></textarea>
      <div class="row"><button id="copy">Copy</button><button id="close">Close</button></div>
    </dialog>
    <script type="module" src="/src/design-lab/main.ts"></script>
  </body>
</html>
